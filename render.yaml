# Render 블루프린트
# GitHub 저장소를 Render 에 연결하면 이 파일만 보고 자동으로 배포됩니다.
services:
  - type: web
    name: history-explorer
    runtime: node
    plan: free
    rootDir: server            # 서버 코드 위치 (게임 파일은 상위 폴더에서 함께 서비스합니다)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # 관리자로 쓸 닉네임 (이 닉네임으로 가입한 계정만 관리자 모드를 볼 수 있습니다)
      - key: ADMIN_USER
        sync: false
      # Neon 접속 주소 (없으면 계정이 파일에 저장되어 재배포 때 사라집니다)
      - key: DATABASE_URL
        sync: false
